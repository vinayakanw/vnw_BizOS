# Render blueprint for the API. The frontend goes on Vercel (see DEPLOY.md).
services:
  - type: web
    name: bizos-api
    runtime: python
    plan: free
    region: ohio # same region as the Neon database (us-east-2), so queries stay fast
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_FORWARDED_FOR
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SECRETS_KEY
        generateValue: true
      - key: DATABASE_URL # your Neon string, starting with postgresql+psycopg://
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS # your Vercel URL, e.g. https://bizos-yourname.vercel.app
        sync: false
      - key: PUBLIC_APP_URL # same Vercel URL
        sync: false
