services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bizos
      POSTGRES_PASSWORD: bizos
      POSTGRES_DB: bizos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
